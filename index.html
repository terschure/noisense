<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geluidssensor 2026-02-28</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/*
Radiaal: 24h met 00:00 bovenaan, kloksgewijs.

Data: JSON file
  {
    "timestamp": "2026-02-28 23:59:50",
    "values": {
      "noise_LAeq": "49.53",
      "noise_LA_min": "45.88",
      "noise_LA_max": "53.88"
    }
  }

*/

const SENSOR_ID = "94448";
const SENSOR_DATE = "2026-02-28";
const DB_MAX = 100;
let aboveThreshold = 0;
const threshold = 70; 
let inPeriod = false;

// Pre-process into sensorHistory
let sensorHistory = [];
let latestMax = 0, latestEq = 0, latestMin = 0;

function timeToAngle(hhmm) {
  let [h, m] = hhmm.split(':').map(Number);
  return ((h * 60 + m) / 1440) * 360;
}

function setup() {
    createCanvas(windowHeight, windowHeight);
    angleMode(DEGREES);
    //noLoop(); // static chart, no need to redraw
    loadJSON("data/sensor_2026-02-28.json", (savedData) => {
        console.log("History loaded.");
        for (let entry of savedData) {
            let mockEntry = {
                timestamp: entry.timestamp,
                sensordatavalues: Object.entries(entry.values).map(([k, v]) => ({value_type: k, value: v}))
                };
                processEntry(mockEntry);
            }
            //startLivePolling();
        noLoop();
    }, (err) => {
        console.warn("History file not found. Starting live mode.");
        //startLivePolling();
    });
    //redraw();
    console.log(sensorHistory);
}

function draw() {
    background(255);
    const cx = width / 2, cy = height / 2;
    const inner = 1, outer = height/2-10;
    
    // calculate number of periods above threshold
    //aboveThreshold = sensorHistory.filter(p => p.eq >= threshold).length;
    for (let p of sensorHistory) {
    if (p.eq >= threshold && !inPeriod) {
        aboveThreshold++;
        inPeriod = true;
    } else if (p.eq < threshold) {
        inPeriod = false;
    }
}

    drawGrid(cx, cy, inner, outer);
    drawClockLabels(cx, cy, outer);
    drawData(cx, cy, inner, outer);
    drawInfo();
}


/* Functions */
function processEntry(entry) {
    let mx = 0, eq = 0, mn = 0;
    if (!entry.sensordatavalues) return;

    for (let item of entry.sensordatavalues) {
        if (item.value_type === "noise_LA_max") mx = float(item.value);
            if (item.value_type === "noise_LAeq") eq = float(item.value);
            if (item.value_type === "noise_LA_min") mn = float(item.value);
    } 
            
    // Note: We keep entry.timestamp exactly as it comes (UTC) 
    // and handle Local conversion in the draw/mapping functions.
    latestMax = mx; latestEq = eq; latestMin = mn;

    let isNew = sensorHistory.length === 0 || entry.timestamp !== sensorHistory[sensorHistory.length - 1].fullTime;
            
    if (isNew) {
        sensorHistory.push({ mx, eq, mn, fullTime: entry.timestamp });
    }
    // Keep roughly a day's worth of data: A full day at 1 reading per 10 seconds = 8640 readings
    if (sensorHistory.length > 8640) sensorHistory.shift();
}


function drawGrid(cx, cy, inner, outer) {
  textAlign(CENTER, BOTTOM);
  textSize(11);

  [//[0, color(200), color(180)],
   [35, color(100,150,255,100), color(100,150,255)],
   [70, color(250,0,100,100),   color(220,0,80)], //[100, color(200), color(180)]
   ].forEach(([db, sc, fc]) => {
    let r = map(db, 0, DB_MAX, inner, outer);
    stroke(sc); noFill();
    ellipse(cx, cy, r * 2);
    fill(fc); noStroke();
    textStyle(NORMAL);
    text(db + " dB", cx, cy + r + 2);
  });
}

function drawClockLabels(cx, cy, outer) {
  push();
  translate(cx, cy);
  textAlign(CENTER, CENTER);
  textSize(11);
  textStyle(NORMAL);
  fill(150); noStroke();
  text("06u", outer - 10, 0);
  text("12u", 0, outer- 10);
  text("18u", -(outer- 10), 0);
  text("00u", 0, -(outer- 10));
  pop();
}

function drawData(cx, cy, inner, outer) {

    push();
    translate(cx, cy);
    rotate(-90); // 00:00 at top

    // Shaded min–max band
    noStroke(); fill(150, 150, 150, 80);
    beginShape();
    for (let p of sensorHistory) {
        // convert time to local -- NOTE: I'm leaving this for now
        // let d = new Date(p.fullTime + "Z");
        // d.toLocaleDateString()
        let a = timeToAngle(p.fullTime.slice(11, 19));
        let r = map(p.mx, 0, DB_MAX, inner, outer);
        vertex(r * cos(a), r * sin(a));
    }
    for (let i = sensorHistory.length - 1; i >= 0; i--) {
        let p = sensorHistory[i];
        let a = timeToAngle(p.fullTime.slice(11, 19));
        let r = map(p.mn, 0, DB_MAX, inner, outer);
        vertex(r * cos(a), r * sin(a));
    }
    endShape(CLOSE);

    // LAeq line
    noFill(); stroke(0); strokeWeight(1.5);
    beginShape();
    for (let p of sensorHistory) {
        let a = timeToAngle(p.fullTime.slice(11, 19));
        let r = map(p.eq, 0, DB_MAX, inner, outer);
        vertex(r * cos(a), r * sin(a));
        //console.log(p);
    }
    endShape();

    pop();
}

function drawInfo() {
    fill(0); noStroke();
    textAlign(LEFT);
    textSize(13);
    textStyle(NORMAL);
    fill(60);
    text("Sensor: " + SENSOR_ID, 6, height - 10);
    //text("LAeq " + latestEq + " dB  (" + latestMin + "–" + latestMax + " dB)", 6, 16);
    //text(sensorHistory.length + " metingen", 6, 32);
    textAlign(RIGHT);
    textStyle(BOLD);
    text(SENSOR_DATE, width - 6, height - 10);
    fill(220, 0, 80); // same red as your 70dB grid line
    text(">" + threshold + " dB: " + aboveThreshold + "×", width - 6, height - 24);
}
</script>
</body>
</html>
