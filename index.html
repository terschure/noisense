<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geluidssensor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap');

  :root {
    --ink:   #1a1a1a;
    --muted: #aaa;
    --red:   rgb(220, 0, 80);
    --blue:  rgb(100, 150, 255);
    --gap:   10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    flex-direction: column;        /* stack header and canvas vertically */
    align-items: center;
    min-height: 100vh;
    font-family: 'IBM Plex Mono', monospace;
  }

  header {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 16px;
    flex-wrap: wrap;
    /* remove position: absolute */
  }
  
  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .center {
    margin: auto;
  }

  .ctrl-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-label input[type=text] {
    background: none;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: 1px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    width: 70px;
    outline: none;
  }
  .ctrl-label input[type=text]:focus { border-bottom-color: var(--ink); }
  .load-btn {
    background: none;
    border: 1px solid var(--ink);
    padding: 3px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.07em;
    cursor: pointer;
    color: var(--ink);
    text-transform: uppercase;
    transition: background 0.12s, color 0.12s;
  }
  .load-btn:hover { background: var(--ink); color: #fff; }

  select {
    background: none;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: 1px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
    appearance: none;         /* removes default browser arrow */
    -webkit-appearance: none;
  }

  select:focus {
    border-bottom-color: var(--ink);
  }

  .status-msg { font-size: 10px; color: var(--muted); }
  .status-msg.error { color: var(--red); }

  input[type=range]:disabled {
    opacity: 0.3;
    pointer-events: none;
  }

</style>
</head>

<body>
<header>
  <div class="controls">
    <a class="ctrl-label" href="./gridview.html"> Naar gridview </a>
    <label class="ctrl-label" for="dataId">Kies een bestand:</label>
      <select id="fileSelect">
    <option value="">-- Selecteer dataset --</option>
  </select>
    </label>
    <button class="load-btn" onclick="loadData('datafile')">Laden</button>
  </div>
  <div class="center"><span class="status-msg" id="status-msg"></span></div>
  <div class="controls">
    <label class="ctrl-label" for="sensorId">Kies een live sensor:</label>
      <select name="Sensor" id="sensorId">
        <option value="93081">93081</option>
        <option value="94448">94448</option>
      </select>
      <button class="load-btn" id="liveBtn" onclick="loadData('live')">Live</button>
    </label>
    <label class="ctrl-label" for="speedSlider">
    Snelheid:
    <input type="range" id="speedSlider" min="1" max="6000" value="1" style="width:200px; accent-color:#a1a1a1; background-color: #aaa">
    <span id="speedVal">1</span>
    </label>
  </div>
</header>


<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/*
Radiaal: 24h met 00:00 bovenaan, kloksgewijs.

Data: JSON file
  {
    "timestamp": "2026-02-28 23:59:50",
    "values": {
      "noise_LAeq": "49.53",
      "noise_LA_min": "45.88",
      "noise_LA_max": "53.88"
    }
  }

*/

let dataMode = null;
let isLoading = false;

// playback settings
let playbackIndex = 0;
let playbackStartTime = null;  // real clock ms when file was loaded
let dataStartTime = null; 

//const POINTS_PER_FRAME = 1; // increase for faster playback
let invertTimer = 0;
let wasAboveThreshold = false;
const fr = 8; //frame rate
const INVERT_DURATION = 2; // frames (~0.5s at 60fps, ~1s at 30fps)
let font;

// general settings
const DB_MAX = 100;
const threshold = 48;
const threshold2 = 70;
const PERIOD_OFFSET = 6;   // px outside the 70 dB ring
const PERIOD_WEIGHT = 4;   // arc thickness in px

//const POLL_INTERVAL_MS   = 5 * 60 * 1000; // 5 minutes
let health = 100;
const DRAIN_EQ  = 0.2;   // per reading with LAeq ≥ threshold (48 dB)
const DRAIN_MAX = 0.5;   // extra per reading with LAmax ≥ threshold2 (70 dB)
const RECOVER   = 0.2;   // per reading with LAeq below threshold
let maxHealth = 100;
let depletedAt = null;

let sensorHistory = [];
let visibleHistory = [];
let latestMax = 0, latestEq = 0, latestMin = 0; latestTime = "", latestDate = "";

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', () => {
  speedVal.textContent = speedSlider.value;
});

function countAboveThreshold(type, thr, history) {
  let count = 0;
  let inPeriod = false;
  for (let p of history) {
    if (type == "max") {
        if (p.mx >= thr && !inPeriod) {
        count++;
        inPeriod = true;
        } else if (p.mx < thr) {
        inPeriod = false;
        }
    } else {
        if (p.eq >= thr && !inPeriod) {
        count++;
        inPeriod = true;
        } else if (p.eq < thr) {
        inPeriod = false;
        }
    }
  }
  return count;
}

async function populateDropdown() {
  try {
    const res = await fetch('data/manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = await res.json();

    const select = document.getElementById('fileSelect');
    files.forEach(name => {
      const option = document.createElement('option');
      option.value = `data/${name}.json`;  // construct path from string
      option.textContent = name;           // use string directly as label
      select.appendChild(option);
    });
  } catch (err) {
    console.error('populateDropdown failed:', err);
  }
}

async function loadData(mode) {
  isLoading = true;
  if (mode !== 'live') dataMode = mode;
  health = maxHealth;
  depletedAt = null;
  invertTimer = 0;
  wasAboveThreshold = false;

  if (mode === 'live') {
    isLiveStopped = false;
    playbackIndex = 0;
    const sensorId = document.getElementById('sensorId').value;
    const url = `https://data.sensor.community/airrohr/v1/sensor/${sensorId}/`;

    // Grey out speed slider
    document.getElementById('speedSlider').disabled = true;
    document.getElementById('speedSlider').value = 1;
    speedVal.textContent = 1; 

    // Switch button to Stop
    const btn = document.getElementById('liveBtn');
    btn.textContent = 'Stop';
    btn.onclick = stopLive;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const response = await res.json();

      if (response && response.length > 0) {
        sensorHistory = [];
        const history = [...response].reverse(); // spread before reversing
        for (let entry of history) {
          processEntry(entry);
        }
        if (sensorHistory.length) {
          const last = sensorHistory[sensorHistory.length - 1];
          latestDate = last.fullTime.slice(0, 10);
          playbackStartTime = millis();
          dataStartTime = sensorHistory[0].t;
          playbackIndex = sensorHistory.length;
          dataMode = 'live'; // only after playbackIndex is set
        }
        //playbackIndex = 0;
        document.getElementById('status-msg').textContent = 'Live data aan het ophalen';

        clearInterval(window._liveInterval);
        window._liveInterval = setInterval(async () => {
          const r = await fetch(url);
          const data = await r.json();
          if (data && data.length > 0) {
            const history = [...data].reverse(); // oldest first
            for (let entry of history) {
              processEntry(entry);
            }
          }
        }, 15000); // fetches data every 15 seconds
      }
    } catch (err) {
      console.error('Live fetch mislukt:', err);
      document.getElementById('status-msg').textContent = 'Fout bij laden.';
      stopLive(); // reset button if fetch fails
    }
    isLoading = false;
  } else {
    // resets
    isLiveStopped = false;
    clearInterval(window._liveInterval);
    document.getElementById('speedSlider').disabled = false;
    const btn = document.getElementById('liveBtn');
    btn.textContent = 'Live';
    btn.onclick = () => loadData('live');

    // get data
    const path = document.getElementById('fileSelect').value;
    if (!path) return;
    loadJSON(path, (raw) => {
      if (dataMode === 'live') return;
      sensorHistory = raw.map(r => ({
        mx:       parseFloat(r.values.noise_LA_max) || 0,
        eq:       parseFloat(r.values.noise_LAeq)   || 0,
        mn:       parseFloat(r.values.noise_LA_min) || 0,
        t:        utcToMs(r.timestamp),            // real time (UTC) in ms, for playback timing
        fullTime: utcToAmsterdam(r.timestamp)      // Amsterdam time, for angles and labels
      }));
      if (sensorHistory.length) {
        const last = sensorHistory[sensorHistory.length - 1];
        latestMax  = last.mx;
        latestEq   = last.eq;
        latestMin  = last.mn;
        latestTime = last.fullTime;
        latestDate = last.fullTime.slice(0, 10);
        playbackStartTime = millis();
        dataStartTime = sensorHistory[0].t;        // was: new Date(sensorHistory[0].fullTime).getTime()
      }
      playbackIndex = 0;
      isLoading = false;
    });
  }
}

function timeToAngle(hhmm) {
  // slice(11,16) gives "HH:MM" cleanly
  let [h, m] = hhmm.split(':').map(Number);
  return ((h * 60 + m) / 1440) * 360;
}
// Timestamps from Sensor.community and the day files are UTC.
// → Amsterdam local time as "YYYY-MM-DD HH:MM:SS" (for the clock face and labels)
const amsFmt = new Intl.DateTimeFormat('sv-SE', {
  timeZone: 'Europe/Amsterdam',
  year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit',
  hourCycle: 'h23'                     // avoids "24:00:00" at midnight
});
function utcToAmsterdam(ts) {
  return amsFmt.format(new Date(ts.replace(' ', 'T') + 'Z'));
}
// → real time in ms (for playback timing, correct on the 25-hour day)
function utcToMs(ts) {
  return Date.parse(ts.replace(' ', 'T') + 'Z');
}

function setup() {
  frameRate(fr);
  const headerHeight = document.querySelector('header').offsetHeight;
  const size = min(windowWidth, windowHeight - headerHeight);
  let cnv = createCanvas(size, size);
  angleMode(DEGREES);
  font = loadFont('https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf');
  textFont(font);

  // Attach click handler directly to the canvas element
  cnv.mouseClicked(() => {
    if (dataMode === 'live') return;
    playbackIndex = 0;
    invertTimer = 0;
    wasAboveThreshold = false;
    health = maxHealth;      // ← new
    depletedAt = null;       // ← new
  });
  
  //loadData();
  populateDropdown();
  //setInterval(loadData, POLL_INTERVAL_MS); // update the data regularly
}

function draw() {
  background(255);
  const cx = width / 2, cy = height / 2;
  const inner = 0, outer = height / 2 - 10;

  // Advance playback
  //let visibleHistory;

  if (playbackStartTime === null) {
    visibleHistory = [];
  } else if (dataMode === 'live') {
    visibleHistory = sensorHistory;
  } else {
    const realElapsedMs = millis() - playbackStartTime;
    const dataElapsedMs = realElapsedMs * int(speedSlider.value);
    const cutoff = dataStartTime + dataElapsedMs;
    visibleHistory = sensorHistory.filter(p => p.t <= cutoff);
  }

  //if (playbackIndex < sensorHistory.length) {
  //  playbackIndex = min(playbackIndex + getPointsPerFrame(), sensorHistory.length);
  //}
  //const visibleHistory = sensorHistory.slice(0, playbackIndex);

  // calculate number of periods above the thresholds
  const aboveThresholdEq = countAboveThreshold("eq", threshold, visibleHistory);
  const aboveThresholdMax = countAboveThreshold("max", threshold2, visibleHistory);
  
  drawData(cx, cy, inner, outer, visibleHistory);
  drawAbovePeriods(cx, cy, inner, outer, visibleHistory);
  
  
  // invert colours when threshold is met for playback values // ADJUST FOR LATEST VALUES
    if (!isLoading && visibleHistory.length > playbackIndex) {

    for (let i = playbackIndex; i < visibleHistory.length; i++) {
      const p = visibleHistory[i];

      if (p.eq >= threshold)  health -= DRAIN_EQ;
      if (p.mx >= threshold2) {
        invertTimer = INVERT_DURATION;
        health -= DRAIN_MAX;
      }
      if (p.eq < threshold)   health += RECOVER;

      health = constrain(health, 0, maxHealth);

      if (health <= 0 && depletedAt === null) {
        depletedAt = p.fullTime.slice(11, 16);
      }
    }

    if (invertTimer > 0) {
      //filter(INVERT);
      //filter(THRESHOLD, 0.5); // converts to black & white, value 0–1
      //filter(GRAY);           // desaturates to grayscale
      //filter(POSTERIZE, 4);   // reduces colour levels, value 2–255
      //filter(BLUR, 2);        // gaussian blur, value = radius in pixels
      filter(ERODE);          // shrinks bright areas (no value needed)
      //filter(DILATE);         // expands bright areas (no value needed)

      // make the red line thicker?
      //let r = map(threshold2, 0, DB_MAX, inner, outer);
      //stroke(250, 0, 100, 100); strokeWeight(4); noFill();
      //ellipse(cx, cy, r * 2);
      //strokeWeight(1);

      invertTimer--;
    }
    playbackIndex = visibleHistory.length;
  }
    drawPlayhead(cx, cy, inner, outer, visibleHistory);
    drawGrid(cx, cy, inner, outer);
    drawClockLabels(cx, cy, outer);
    drawInfo(aboveThresholdEq, aboveThresholdMax);
    drawHeart();
    updateHealth(health, maxHealth);
    drawDepleted();
    drawFinished(cx, cy, aboveThresholdMax);
}


/* Functions */
function processEntry(entry) {
  let mx = 0, eq = 0, mn = 0;
  if (!entry.sensordatavalues) return;

  for (let item of entry.sensordatavalues) {
    if (item.value_type === "noise_LA_max") mx = float(item.value);
    if (item.value_type === "noise_LAeq")   eq = float(item.value);
    if (item.value_type === "noise_LA_min") mn = float(item.value);
  }

  latestMax = mx; latestEq = eq; latestMin = mn;

  const ts = utcToAmsterdam(entry.timestamp);

  let isNew = sensorHistory.length === 0 ||
              ts !== sensorHistory[sensorHistory.length - 1].fullTime;

  if (isNew) {
    sensorHistory.push({ mx, eq, mn, t: utcToMs(entry.timestamp), fullTime: ts });
  }
  if (sensorHistory.length > 8640) sensorHistory.shift();

}

function drawGrid(cx, cy, inner, outer) {
  textAlign(CENTER, BOTTOM);
  textSize(11);
  strokeWeight(0.5);

  [
    [35, color(100, 150, 255, 255), color(100, 150, 255)],
    [70, color(250, 0, 100, 255),   color(220, 0, 80)]
  ].forEach(([db, sc, fc]) => {
    let r = map(db, 0, DB_MAX, inner, outer);
    stroke(sc); noFill();
    ellipse(cx, cy, r * 2);
    fill(fc); noStroke();
    textStyle(NORMAL);
    text(db + " dB", cx, cy + r + 2);
  });
}

function drawClockLabels(cx, cy, outer) {
  push();
  translate(cx, cy);
  textAlign(CENTER, CENTER);
  textSize(11);
  textStyle(NORMAL);
  fill(150); noStroke();
  text("06u", outer - 10, 0);
  text("12u", 0, outer - 10);
  text("18u", -(outer - 10), 0);
  text("00u", 0, -(outer - 10));
  pop();
}

function drawData(cx, cy, inner, outer, history) {
  push();
  translate(cx, cy);
  rotate(-90); // 00:00 at top

  /*// Shaded min–max band
  noStroke(); fill(150, 150, 150, 80);
  beginShape();
  for (let p of sensorHistory) {
    // use slice(11,16) for clean "HH:MM"
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.mx, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  for (let i = sensorHistory.length - 1; i >= 0; i--) {
    let p = sensorHistory[i];
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.mn, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  endShape(CLOSE); */

  // Min–max bars
  //stroke(100, 100, 100, 120);
  strokeWeight(1);
  noFill();
  for (let i = 0; i < history.length; i++) {
    stroke(100,100,100,map(history[i].eq, 20, DB_MAX-20, 0, 255));
    let a = timeToAngle(history[i].fullTime.slice(11, 16));
    let rMin = map(history[i].mn, 0, DB_MAX, inner, outer);
    let rMax = map(history[i].mx, 0, DB_MAX, inner, outer);
    line(rMin * cos(a), rMin * sin(a), rMax * cos(a), rMax * sin(a));
  }

  // LAeq line
  noFill(); stroke(0); strokeWeight(1.5);
  beginShape();
  for (let p of history) {
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.eq, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  endShape();

  pop();
}

function drawHeart () {
  let x = width - 180;
  let y = height - 28;
  let size = 14;
  fill(220, 0, 80);

  if (health <= 0) {
    fill(100,100,100, 100);
    size = 14 - 2 * sin(frameCount * 1);
  }

  beginShape();
  stroke(0);
  strokeWeight(1);

  vertex(x, y);
  bezierVertex(x - size / 2, y - size / 2, x - size, y + size / 3, x, y + size);
  bezierVertex(x + size, y + size / 3, x + size / 2, y - size / 2, x, y);
  endShape(CLOSE);

  // draw health rectangle
  stroke(0);
  let sw = 1;
  strokeWeight(sw);
  noFill();
  rect(width - 160, height - 28, 154, 11); // x, y, l, h
}

function updateHealth(health, maxHealth) {
  
  if (dataMode !== 'live' && visibleHistory.length >= sensorHistory.length) return;
  let sw = 1;
  noStroke();
  fill(220, 0, 80);
  // Remap health
  rect(width - 160 + sw/2, height - 28 + sw/2, 
    map(health, 0, maxHealth, 0, 154 - sw), 11 - sw);
}

function drawDepleted() {
  if (depletedAt === null) return; // removed health > 0 || so keeps the first hit
  push();
  noStroke();
  fill(0);
  textAlign(RIGHT, CENTER);
  textSize(9);                                  // the bar is only 11px tall
  textStyle(NORMAL);
  // centre of the bar: x = width-160 + 154/2, y = height-28 + 11/2
  text("depleted at " + depletedAt, width - 6 - 4, height - 28 + 5);
  pop();
}

function drawInfo(aboveThresholdEq, aboveThresholdMax) {
  fill(0); noStroke();
  textAlign(LEFT);
  textSize(13);
  textStyle(NORMAL);
  fill(60);
  //text("Sensor: " + SENSOR_ID, 6, height - 24);
  textStyle(BOLD);
  text(latestDate, 6, height - 10);
  
  textAlign(RIGHT);
  textStyle(NORMAL);
  fill(100, 100, 100);
  text("Eq > " + threshold + " dB: " + aboveThresholdEq + "x", width - 6, height - 42);
  fill(220, 0, 80);
  text("Max > " + threshold2 + " dB: " + aboveThresholdMax + "x", width - 6, height - 30);
}

function drawPlayhead(cx, cy, inner, outer, history) {
  if (history.length === 0) return;

  if (dataMode === 'live') {
    const last = history[history.length - 1];
    const a = timeToAngle(last.fullTime.slice(11, 16));
    const r = map(max(last.mx, threshold2), 0, DB_MAX, inner, outer);

    push();
    translate(cx, cy);
    rotate(-90);

    const pulse = 4 + 1 * sin(frameCount * 5);
    const px = r * cos(a);
    const py = r * sin(a);

    noFill(); stroke(220, 0, 80, 80); strokeWeight(1);
    ellipse(px, py, (pulse + 4) * 2);
    fill(220, 0, 80); noStroke();
    ellipse(px, py, pulse * 2);

    pop();
    return;
  }

  if (history.length >= sensorHistory.length) return;

  const last = history[history.length - 1];
  const next = sensorHistory[history.length]; // the upcoming point

  // How far between last and next timestamp (0–1)
  const lastT = last.t;
  const nextT = next.t;
  const realElapsedMs = millis() - playbackStartTime;
  const dataElapsedMs = realElapsedMs * int(speedSlider.value);
  const nowT = dataStartTime + dataElapsedMs;
  const t = constrain((nowT - lastT) / (nextT - lastT), 0, 1);

  // Interpolate angle and radius
  const aLast = timeToAngle(last.fullTime.slice(11, 16));
  const aNext = timeToAngle(next.fullTime.slice(11, 16));
  const rLast = map(max(last.mx, threshold2), 0, DB_MAX, inner, outer);
  const rNext = map(max(next.mx, threshold2), 0, DB_MAX, inner, outer);

  const a = lerp(aLast, aNext, t);
  const r = lerp(rLast, rNext, t);

  push();
  translate(cx, cy);
  rotate(-90);

  // Comet tail (unchanged, still uses history)
  const tailLength = 8;
  const start = max(0, history.length - tailLength);
  for (let i = start; i < history.length - 1; i++) {
    const p = history[i];
    const pa = timeToAngle(p.fullTime.slice(11, 16));
    const pr = map(max(p.mx, threshold2), 0, DB_MAX, inner, outer);
    const alpha = map(i, start, history.length - 1, 40, 160);
    stroke(220, 0, 80, alpha);
    strokeWeight(6);
    point(pr * cos(pa), pr * sin(pa));
  }

  // Pulsing dot at interpolated position
  const pulse = 4 + 2 * sin(frameCount * 0.4);
  const px = r * cos(a);
  const py = r * sin(a);

  noFill(); stroke(220, 0, 80, 80); strokeWeight(1);
  ellipse(px, py, (pulse + 4) * 2);

  fill(220, 0, 80); noStroke();
  ellipse(px, py, pulse * 2);

  pop();
}

function windowResized() {
  const headerHeight = document.querySelector('header').offsetHeight;
  const size = min(windowWidth, windowHeight - headerHeight);
  resizeCanvas(size, size);
}

/*function getPointsPerFrame() {
  // Target: finish playback in X seconds regardless of dataset size
  const TARGET_FRAMES = 86400 * fr;
  const density = max(1, floor(sensorHistory.length / TARGET_FRAMES));
  return density * int(speedSlider.value);
}*/

function stopLive() {
  clearInterval(window._liveInterval);

  // trigger drawfinished
  playbackIndex = visibleHistory.length;

  // Re-enable speed slider
  document.getElementById('speedSlider').disabled = false;

  // Reset button back to Live
  const btn = document.getElementById('liveBtn');
  btn.textContent = 'Live';
  btn.onclick = () => loadData('live');

  document.getElementById('status-msg').textContent = '';

  isLiveStopped = true;
}

function drawFinished(cx, cy, aboveThresholdMax) {
  if (sensorHistory.length === 0) return;
  if (dataMode === 'live' && !isLiveStopped) return; // never show during live;
  if (dataMode !== 'live' && visibleHistory.length < sensorHistory.length) return;


  push();
  textAlign(CENTER, CENTER);
  noStroke();

  // Large count
  fill(220, 0, 80);
  textSize(68);
  textStyle(BOLD);
  text(aboveThresholdMax + "x", cx, cy - 16);

  // Label below
  textSize(11);
  textStyle(NORMAL);
  text("boven " + threshold2 + " dB", cx, cy + 36);
  pop();
}


// _____ create arcs_______________

// _____ create arcs_______________

// Periods where LAmax ≥ thr, as arcs in seconds of the clock day.
// An arc runs from the first reading above the threshold to the first reading
// back below it. When the clock label jumps backwards (the repeated 02:xx hour
// on 25 October, or midnight in a history that spans two days) the arc is cut
// there instead of wrapping around the circle.
function getAboveArcs(history, thr) {
  const sec = p => {
    const [h, m, s] = p.fullTime.slice(11, 19).split(':').map(Number);
    return h * 3600 + m * 60 + s;
  };
  const arcs = [];
  let cur = null;
  for (const p of history) {
    const s = sec(p);
    if (cur && s < cur.end) { arcs.push(cur); cur = null; }   // clock went back: close the arc
    if (p.mx >= thr) {
      if (!cur) cur = { start: s, end: s };
      else      cur.end = s;
    } else if (cur) {
      cur.end = s;                                            // first reading below closes it
      arcs.push(cur);
      cur = null;
    }
  }
  if (cur) arcs.push(cur);
  return arcs;
}

function drawAbovePeriods(cx, cy, inner, outer, history) {
  const r = map(threshold2, 0, DB_MAX, inner, outer) + PERIOD_OFFSET;

  push();
  translate(cx, cy);
  rotate(-90);                       // same orientation as drawData: 00:00 at the top
  noFill();
  stroke(220, 0, 80);
  strokeWeight(PERIOD_WEIGHT);
  strokeCap(SQUARE);

  for (const a of getAboveArcs(history, threshold2)) {
    const a1 = (a.start / 86400) * 360;
    const a2 = max((a.end / 86400) * 360, a1 + 0.5);   // single readings still get a visible sliver
    arc(0, 0, r * 2, r * 2, a1, a2, OPEN);
  }
  pop();
}
