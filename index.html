<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geluidssensor 2026-02-28</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/*
Radiaal: 24h met 00:00 bovenaan, kloksgewijs.

Data: JSON file
  {
    "timestamp": "2026-02-28 23:59:50",
    "values": {
      "noise_LAeq": "49.53",
      "noise_LA_min": "45.88",
      "noise_LA_max": "53.88"
    }
  }

*/

const SENSOR_ID = "94448";
const SENSOR_DATE = "2026-02-28";
const DB_MAX = 100;
const threshold = 48;
const threshold2 = 70;

// ── CONFIG — set your JSONBin details here ──────────────────────────────────
const JSONBIN_BIN_ID     = "69b1cdc7c3097a1dd519322d";
const JSONBIN_ACCESS_KEY = "$2a$10$ADvovg8.oTelqlmX0njNZOaJR9ERemNqwaVsHzUqyFHxY6fTeOXhC";
const POLL_INTERVAL_MS   = 5 * 60 * 1000; // 5 minutes
// ────────────────────────────────────────────────────────────────────────────
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`;

let sensorHistory = [];
let latestMax = 0, latestEq = 0, latestMin = 0; latestTime = "", latestDate = "";

// FIX 1: aboveThreshold is computed once from sensorHistory, not accumulated
//        across draw() frames. Moved computation into a helper function.
function countAboveThreshold(type, thr, history) {
  let count = 0;
  let inPeriod = false;
  for (let p of history) {
    if (type == "max") {
        if (p.mx >= thr && !inPeriod) {
        count++;
        inPeriod = true;
        } else if (p.mx < thr) {
        inPeriod = false;
        }
    } else {
        if (p.eq >= thr && !inPeriod) {
        count++;
        inPeriod = true;
        } else if (p.eq < thr) {
        inPeriod = false;
        }
    }
  }
  return count;
}

async function loadData() {
  try {
    const res = await fetch(JSONBIN_URL, {
      headers: { "X-Access-Key": JSONBIN_ACCESS_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    // Filter out placeholder rows
    const raw = json.record.filter(r => r.timestamp !== "");
    if (!raw.length) return;

    // map raw records (which use entry.values.*) into {mx, eq, mn, fullTime}
    sensorHistory = raw.map(r => ({
      mx:       parseFloat(r.values.noise_LA_max) || 0,
      eq:       parseFloat(r.values.noise_LAeq)   || 0,
      mn:       parseFloat(r.values.noise_LA_min) || 0,
      fullTime: r.timestamp
    }));


    if (sensorHistory.length) {
      const last = sensorHistory[sensorHistory.length - 1];
      latestMax = last.mx;
      latestEq  = last.eq;
      latestMin = last.mn;
      latestTime = last.fullTime;
      latestDate = last.fullTime.slice(0, 10);
    }
  }
  catch (err) {
    console.warn("History file not found or fetch error:", err);
  }
}

function timeToAngle(hhmm) {
  // slice(11,16) gives "HH:MM" cleanly
  let [h, m] = hhmm.split(':').map(Number);
  return ((h * 60 + m) / 1440) * 360;
}

function setup() {
  createCanvas(windowHeight, windowHeight);
  angleMode(DEGREES);
  loadData();
  setInterval(loadData, POLL_INTERVAL_MS); // update the data regularly
}

function draw() {
  background(255);
  const cx = width / 2, cy = height / 2;
  const inner = 1, outer = height / 2 - 10;

  // FIX 1 (continued): compute aboveThreshold fresh from current data each frame
  //        instead of accumulating it as a global counter across frames.
  const aboveThresholdEq = countAboveThreshold("eq", threshold, sensorHistory);
  const aboveThresholdMax = countAboveThreshold("max", threshold2, sensorHistory);

  drawGrid(cx, cy, inner, outer);
  drawClockLabels(cx, cy, outer);
  drawData(cx, cy, inner, outer);
  drawInfo(aboveThresholdEq, aboveThresholdMax);
}


/* Functions */
function processEntry(entry) {
  let mx = 0, eq = 0, mn = 0;
  if (!entry.sensordatavalues) return;

  for (let item of entry.sensordatavalues) {
    if (item.value_type === "noise_LA_max") mx = float(item.value);
    if (item.value_type === "noise_LAeq")   eq = float(item.value);
    if (item.value_type === "noise_LA_min") mn = float(item.value);
  }

  latestMax = mx; latestEq = eq; latestMin = mn;

  let isNew = sensorHistory.length === 0 ||
              entry.timestamp !== sensorHistory[sensorHistory.length - 1].fullTime;

  if (isNew) {
    sensorHistory.push({ mx, eq, mn, fullTime: entry.timestamp });
  }
  if (sensorHistory.length > 8640) sensorHistory.shift();
}

function drawGrid(cx, cy, inner, outer) {
  textAlign(CENTER, BOTTOM);
  textSize(11);

  [
    [35, color(100, 150, 255, 100), color(100, 150, 255)],
    [70, color(250, 0, 100, 100),   color(220, 0, 80)]
  ].forEach(([db, sc, fc]) => {
    let r = map(db, 0, DB_MAX, inner, outer);
    stroke(sc); noFill();
    ellipse(cx, cy, r * 2);
    fill(fc); noStroke();
    textStyle(NORMAL);
    text(db + " dB", cx, cy + r + 2);
  });
}

function drawClockLabels(cx, cy, outer) {
  push();
  translate(cx, cy);
  textAlign(CENTER, CENTER);
  textSize(11);
  textStyle(NORMAL);
  fill(150); noStroke();
  text("06u", outer - 10, 0);
  text("12u", 0, outer - 10);
  text("18u", -(outer - 10), 0);
  text("00u", 0, -(outer - 10));
  pop();
}

function drawData(cx, cy, inner, outer) {
  push();
  translate(cx, cy);
  rotate(-90); // 00:00 at top

  // Shaded min–max band
  noStroke(); fill(150, 150, 150, 80);
  beginShape();
  for (let p of sensorHistory) {
    // use slice(11,16) for clean "HH:MM"
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.mx, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  for (let i = sensorHistory.length - 1; i >= 0; i--) {
    let p = sensorHistory[i];
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.mn, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  endShape(CLOSE);

  // LAeq line
  noFill(); stroke(0); strokeWeight(1.5);
  beginShape();
  for (let p of sensorHistory) {
    let a = timeToAngle(p.fullTime.slice(11, 16));
    let r = map(p.eq, 0, DB_MAX, inner, outer);
    vertex(r * cos(a), r * sin(a));
  }
  endShape();

  pop();
}

function drawInfo(aboveThresholdEq, aboveThresholdMax) {
  fill(0); noStroke();
  textAlign(LEFT);
  textSize(13);
  textStyle(NORMAL);
  fill(60);
  text("Sensor: " + SENSOR_ID, 6, height - 10);
  textAlign(RIGHT);
  textStyle(BOLD);
  text(latestDate, width - 6, height - 10);
  fill(220, 0, 80);
  textStyle(NORMAL);
  text("Eq > " + threshold + " dB: " + aboveThresholdEq + "×", width - 6, height - 36);
  text("Max > " + threshold2 + " dB: " + aboveThresholdMax + "×", width - 6, height - 24);
}
</script>
</body>
</html>
