<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geluidssensor — Overzicht</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap');

  :root {
    --ink:   #1a1a1a;
    --muted: #aaa;
    --red:   rgb(220, 0, 80);
    --blue:  rgb(100, 150, 255);
    --cols:  4;
    --gap:   10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 24px 20px 60px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-meta {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .ctrl-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-label input[type=text] {
    background: none;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: 1px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink);
    width: 70px;
    outline: none;
  }
  .ctrl-label input[type=text]:focus { border-bottom-color: var(--ink); }

  /* Column stepper */
  .col-stepper {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .col-stepper button {
    background: none;
    border: 1px solid #ddd;
    width: 20px; height: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.1s;
  }
  .col-stepper button:hover { border-color: var(--ink); }
  .col-count { min-width: 14px; text-align: center; color: var(--ink); }

  .load-btn {
    background: none;
    border: 1px solid var(--ink);
    padding: 3px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.07em;
    cursor: pointer;
    color: var(--ink);
    text-transform: uppercase;
    transition: background 0.12s, color 0.12s;
  }
  .load-btn:hover { background: var(--ink); color: #fff; }

  .status-msg { font-size: 10px; color: var(--muted); }
  .status-msg.error { color: var(--red); }

  /* ── Grid ── */
  #grid-container {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
  }

  /* ── Cell ── */
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .day-cell.no-data { opacity: 0.25; cursor: default; pointer-events: none; }

  .cell-date {
    font-size: 9px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 3px;
    align-self: flex-start;
  }

  canvas.day-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
  }

  .cell-stats {
    margin-top: 3px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: var(--muted);
  }
  .stat-red  { color: var(--red); }
  .stat-blue { color: var(--blue); }

  /* Loading */
  .loading-msg {
    color: var(--muted);
    font-size: 11px;
    padding: 40px 0;
    grid-column: 1 / -1;
    white-space: pre-wrap;
  }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.94);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
  }
  #lightbox.open { display: flex; }
  #lightbox-canvas {
    display: block;
  }
  #lightbox-date {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  #lightbox-stats {
    font-size: 11px;
    display: flex;
    gap: 24px;
  }
  #lightbox-close {
    position: fixed;
    top: 18px; right: 22px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Geluidssensor</h1>
    <span class="header-meta" id="header-meta"></span>
  </div>
  <div class="controls">
    <label class="ctrl-label" for="sensorId">Kies een sensor:</label>
      <select name="Sensor" id="sensorId">
        <option value="93081">93081</option>
        <option value="94448">94448</option>
      </select>
    </label>
    <div class="col-stepper">
      Kolommen
      <button onclick="adjustCols(-1)">−</button>
      <span class="col-count" id="col-count">4</span>
      <button onclick="adjustCols(1)">+</button>
    </div>
    <button class="load-btn" onclick="loadAll()">Laden</button>
    <span class="status-msg" id="status-msg"></span>
  </div>
</header>

<div id="grid-container">
  <p class="loading-msg">Klik op Laden om de data in te lezen.</p>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close">sluiten ×</span>
  <canvas id="lightbox-canvas"></canvas>
  <div id="lightbox-date"></div>
  <div id="lightbox-stats"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────
const DB_MAX     = 100;
const THRESHOLD1 = 35;
const THRESHOLD2 = 70;
const DATA_PATH  = 'data/';

let numCols = 4;

// ── Column stepper ─────────────────────────────────────────
function adjustCols(delta) {
  numCols = Math.max(1, Math.min(14, numCols + delta));
  document.getElementById('col-count').textContent = numCols;
  document.getElementById('grid-container').style.setProperty('--cols', numCols);
  setTimeout(() => {
    document.querySelectorAll('canvas.day-canvas').forEach(c => {
      if (c._records !== undefined) drawDayDiagram(c, c._records);
    });
  }, 50);
}

// ── Parse raw JSON ─────────────────────────────────────────
function parseRecords(raw) {
  return raw.map(r => ({
    mx:       parseFloat(r.values.noise_LA_max) || 0,
    eq:       parseFloat(r.values.noise_LAeq)   || 0,
    mn:       parseFloat(r.values.noise_LA_min) || 0,
    fullTime: r.timestamp
  }));
}

// ── Geometry helpers ───────────────────────────────────────
function timeToAngleDeg(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return ((h * 60 + m) / 1440) * 360;
}
function polarToXY(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

// ── Count threshold crossings ──────────────────────────────
function countCrossings(history, type, thr) {
  let count = 0, inPeriod = false;
  for (const p of history) {
    const v = type === 'max' ? p.mx : p.eq;
    if (v >= thr && !inPeriod) { count++; inPeriod = true; }
    else if (v < thr)           { inPeriod = false; }
  }
  return count;
}

// ── Draw radial diagram ────────────────────────────────────

// ── Periods above red threshold, with duration ─────────────
function getAbovePeriods(history, thr) {
  const periods = [];
  let start = null;
  for (const p of history) {
    if (p.mx >= thr && start === null) {
      start = p.fullTime;
    } else if (p.mx < thr && start !== null) {
      periods.push({ start, end: p.fullTime });
      start = null;
    }
  }
  if (start !== null && history.length > 0)
    periods.push({ start, end: history[history.length - 1].fullTime });
  return periods;
}

function periodsTotalMinutes(periods) {
  return periods.reduce((sum, p) => {
    const toMin = t => { const [h, m] = t.slice(11,16).split(':').map(Number); return h*60+m; };
    return sum + Math.max(0, toMin(p.end) - toMin(p.start));
  }, 0);
}

function fmtMinutes(mins) {
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m === 0 ? h + 'u' : h + 'u' + m + 'm';
}

function drawDayDiagram(canvas, history, explicitSize) {
  const dpr  = window.devicePixelRatio || 1;
  const size = explicitSize || canvas.clientWidth;
  if (size === 0) return;

  canvas.width  = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const pad   = size * 0.08;
  const outer = size / 2 - pad;

  ctx.clearRect(0, 0, size, size);

  if (!history || history.length === 0) {
    ctx.fillStyle = '#ccc';
    ctx.font = `${size * 0.07}px IBM Plex Mono, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('geen data', cx, cy);
    return;
  }

  // Threshold circles
  [[THRESHOLD1, 'rgba(100,150,255,0.55)'], [THRESHOLD2, 'rgba(220,0,80,0.55)']].forEach(([db, col]) => {
    const r = (db / DB_MAX) * outer;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.4, size * 0.003);
    ctx.setLineDash([2, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Min–max bars
  for (const p of history) {
    const a    = timeToAngleDeg(p.fullTime.slice(11, 16));
    const rMin = (p.mn / DB_MAX) * outer;
    const rMax = (p.mx / DB_MAX) * outer;
    const alpha = Math.min(1, Math.max(0, (p.eq - 20) / 60));
    const [x1, y1] = polarToXY(cx, cy, rMin, a);
    const [x2, y2] = polarToXY(cx, cy, rMax, a);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(120,120,120,${alpha * 0.5})`;
    ctx.lineWidth = Math.max(0.5, size * 0.003);
    ctx.stroke();
  }

  // LAeq line
  ctx.beginPath();
  let first = true;
  for (const p of history) {
    const a = timeToAngleDeg(p.fullTime.slice(11, 16));
    const r = (p.eq / DB_MAX) * outer;
    const [x, y] = polarToXY(cx, cy, r, a);
    if (first) { ctx.moveTo(x, y); first = false; }
    else        { ctx.lineTo(x, y); }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = Math.max(0.8, size * 0.004);
  ctx.stroke();

  // Clock labels
  const fs = Math.max(7, size * 0.03);
  ctx.fillStyle = 'rgba(160,160,160,0.7)';
  ctx.font = `${fs}px IBM Plex Mono, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tickR = outer + pad * 0.55;
  [['00', 0], ['06', 90], ['12', 180], ['18', -90]].forEach(([lbl, a]) => {
    const [x, y] = polarToXY(cx, cy, tickR, a);
    ctx.fillText(lbl, x, y);
  });

  // Centre label: red crossing count + total duration
  const redPeriods = getAbovePeriods(history, THRESHOLD2);
  if (redPeriods.length > 0) {
    const totalMins = periodsTotalMinutes(redPeriods);
    const fsLarge = Math.max(9,  size * 0.10);
    const fsSmall = Math.max(7,  size * 0.055);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Count
    ctx.font = `500 ${fsLarge}px IBM Plex Mono, monospace`;
    ctx.fillStyle = 'rgba(220,0,80,0.90)';
    ctx.fillText(redPeriods.length + '×', cx, cy - fsSmall * 0.6);
    // Duration
    ctx.font = `300 ${fsSmall}px IBM Plex Mono, monospace`;
    ctx.fillStyle = 'rgba(220,0,80,0.65)';
    ctx.fillText(fmtMinutes(totalMins), cx, cy + fsLarge * 0.6);
  }
}

// ── Lightbox ───────────────────────────────────────────────
function openLightbox(date, records) {
  const lb     = document.getElementById('lightbox');
  const lbCvs  = document.getElementById('lightbox-canvas');
  const lbDate = document.getElementById('lightbox-date');
  const lbStat = document.getElementById('lightbox-stats');

  const size = Math.floor(Math.min(window.innerWidth * 0.88, window.innerHeight * 0.82));
  lbCvs.style.width  = size + 'px';
  lbCvs.style.height = size + 'px';
  drawDayDiagram(lbCvs, records, size);

  lbDate.textContent = date;
  const above1 = countCrossings(records, 'eq',  THRESHOLD1);
  const above2 = countCrossings(records, 'max', THRESHOLD2);
  lbStat.innerHTML =
    `<span class="stat-blue">≥${THRESHOLD1} dB (eq): ${above1}×</span>` +
    `<span class="stat-red">≥${THRESHOLD2} dB (max): ${above2}×</span>`;

  lb.classList.add('open');
  document.addEventListener('keydown', onEsc);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', onEsc);
}
function onEsc(e) { if (e.key === 'Escape') closeLightbox(); }

// ── Render grid ────────────────────────────────────────────
function renderGrid(results, sensorId) {
  const container = document.getElementById('grid-container');
  container.style.setProperty('--cols', numCols);

  // Newest first
  const sorted = [...results].sort((a, b) => b.date.localeCompare(a.date));

  let html = '';
  for (const { date, records } of sorted) {
    const noData = records.length === 0;
    const above1 = countCrossings(records, 'eq',  THRESHOLD1);
    const above2 = countCrossings(records, 'max', THRESHOLD2);
    html += `<div class="day-cell${noData ? ' no-data' : ''}" data-date="${date}" onclick="handleCellClick('${date}')">`;
    html += `<div class="cell-date">${date.slice(8)} <span style="opacity:.4">${date.slice(5,7)}</span></div>`;
    html += `<canvas class="day-canvas" id="canvas-${date}"></canvas>`;
    if (!noData) {
      html += `<div class="cell-stats"><span class="stat-blue">${above1}×</span></div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html || '<p class="loading-msg">Geen resultaten.</p>';

  for (const { date, records } of sorted) {
    const canvas = document.getElementById(`canvas-${date}`);
    if (canvas) {
      canvas._records = records;
      drawDayDiagram(canvas, records);
    }
  }

  const total = results.filter(r => r.records.length > 0).length;
  document.getElementById('header-meta').textContent =
    `${sensorId} · ${total} / ${results.length} dagen`;
}

// ── Cell click ─────────────────────────────────────────────
function handleCellClick(date) {
  const canvas = document.getElementById(`canvas-${date}`);
  if (!canvas || !canvas._records || canvas._records.length === 0) return;
  openLightbox(date, canvas._records);
}

// ── Main loader ────────────────────────────────────────────
async function loadAll() {
  const sensorId  = document.getElementById('sensorId').value.trim();
  const container = document.getElementById('grid-container');
  const statusEl  = document.getElementById('status-msg');

  container.innerHTML  = '<p class="loading-msg">manifest.json laden…</p>';
  statusEl.className   = 'status-msg';
  statusEl.textContent = '';

  // 1. Fetch manifest
  let dates;
  try {
    const res = await fetch(`${DATA_PATH}manifest.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const manifest = await res.json();
    dates = Array.isArray(manifest) ? manifest : manifest.dates;
    if (!Array.isArray(dates) || dates.length === 0) throw new Error('leeg manifest');
  } catch (err) {
    statusEl.className   = 'status-msg error';
    statusEl.textContent = `manifest.json niet gevonden (${err.message})`;
    container.innerHTML  =
      `<pre class="loading-msg">Maak data/manifest.json aan:\n\n[\n  "2026-02-01",\n  "2026-02-28"\n]\n\nOf gebruik generate-manifest.sh.</pre>`;
    return;
  }

  container.innerHTML = '<p class="loading-msg">Dagbestanden laden…</p>';

  // 2. Filter to the selected sensor, then fetch
  const filtered = dates.filter(stem => stem.startsWith(`sensor${sensorId}_`));

  if (filtered.length === 0) {
    container.innerHTML = `<p class="loading-msg">Geen bestanden gevonden voor sensor ${sensorId}.</p>`;
    return;
  }

  const results = await Promise.all(filtered.map(async stem => {
    // Extract the date portion (last 10 chars: YYYY-MM-DD)
    const date = stem.slice(-10);
    try {
      const res = await fetch(`${DATA_PATH}${stem}.json`);
      if (!res.ok) throw new Error('not found');
      const raw = await res.json();
      return { date, records: parseRecords(raw) };
    } catch {
      return { date, records: [] };
    }
  }));

  renderGrid(results, sensorId);
}

// ── Resize ─────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll('canvas.day-canvas').forEach(c => {
      if (c._records !== undefined) drawDayDiagram(c, c._records);
    });
  }, 150);
});

// Auto-load on open
loadAll();
</script>
</body>
</html>
