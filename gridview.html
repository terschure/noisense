<!DOCTYPE html>
<html lang="nl">
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geluidssensor — Overzicht</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap');

  :root {
    --ink:   #1a1a1a;
    --muted: #aaa;
    --red:   rgb(220, 0, 80);
    --blue:  rgb(100, 150, 255);
    --cols:  4;
    --gap:   10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 24px 20px 60px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-meta {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .ctrl-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-label input[type=text] {
    background: none;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: 1px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    width: 70px;
    outline: none;
  }
  .ctrl-label input[type=text]:focus { border-bottom-color: var(--ink); }

  /* Column stepper */
  .col-stepper {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .col-stepper button {
    background: none;
    border: 1px solid #ddd;
    width: 20px; height: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.1s;
  }
  .col-stepper button:hover { border-color: var(--ink); }
  .col-count { min-width: 14px; text-align: center; color: var(--ink); }

  .mode-btn {
  width: auto !important;
  padding: 0 8px;
  letter-spacing: 0.05em;
  }

  .load-btn {
    background: none;
    border: 1px solid var(--ink);
    padding: 3px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.07em;
    cursor: pointer;
    color: var(--ink);
    text-transform: uppercase;
    transition: background 0.12s, color 0.12s;
  }
  .load-btn:hover { background: var(--ink); color: #fff; }

  .status-msg { font-size: 10px; color: var(--muted); }
  .status-msg.error { color: var(--red); }

  /* ── Grid ── */
  #grid-container {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);
  }

  /* ── Cell ── */
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .day-cell.no-data { opacity: 0.25; cursor: default; pointer-events: none; }

  .cell-date {
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 3px;
    align-self: flex-start;
  }

  canvas.day-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
  }

  .cell-stats {
    margin-top: 3px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
  }
  .stat-red  { color: var(--red); }
  .stat-blue { color: var(--blue); }

  /* Loading */
  .loading-msg {
    color: var(--muted);
    font-size: 12px;
    padding: 40px 0;
    grid-column: 1 / -1;
    white-space: pre-wrap;
  }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.94);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
  }
  #lightbox.open { display: flex; }
  #lightbox-canvas {
    display: block;
  }
  #lightbox-date {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  #lightbox-stats {
  font-size: 14px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 24px;
  }
  #lightbox-stats .stat-blue { text-align: right; }
  #lightbox-stats .stat-red  { text-align: left; }
  #lightbox-close {
    position: fixed;
    top: 18px; right: 22px;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    cursor: pointer;
  }
  #lightbox-actions {
  position: fixed;
  bottom: 18px; right: 22px;
  display: flex; gap: 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  }
  #lightbox-actions span { cursor: pointer; }
  #lightbox-actions span:hover { color: var(--ink); }
  #lightbox-date {
  white-space: pre-line;
  text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="ctrl-label" href="./index.html"> Link naar andere weergave </a>
    <h1>Noisense</h1>
    <span class="header-meta" id="header-meta"></span>
  </div>
  <div class="controls">
    <label class="ctrl-label" for="sensorId">Kies een sensor:</label>
      <select name="Sensor" id="sensorId">
        <option value="93081">93081</option>
        <option value="94448">94448</option>
      </select>
    </label>
    <button class="load-btn" onclick="loadAll()">Laden</button>
    <div class="col-stepper">
      Kolommen
      <button onclick="adjustCols(-1)">−</button>
      <span class="col-count" id="col-count">4</span>
      <button onclick="adjustCols(1)">+</button>
    </div>
    <div class="col-stepper">
    Highlight
    <button id="mode-btn" class="mode-btn" onclick="toggleMode()">perioden</button>
    </div>
    <span class="status-msg" id="status-msg"></span>
  </div>
</header>

<div id="grid-container">
  <p class="loading-msg">Klik op Laden om de data in te lezen.</p>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close">sluiten ×</span>
  <div id="lightbox-actions">
    <span onclick="event.stopPropagation(); exportCurrent('png')">png ↓</span>
    <span onclick="event.stopPropagation(); exportCurrent('pdf')">pdf ↓</span>
  </div>
  <canvas id="lightbox-canvas"></canvas>
  <div id="lightbox-date"></div>
  <div id="lightbox-stats"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────
const DB_MAX     = 100;
const THRESHOLD1 = 48;
const THRESHOLD2 = 70;
const DATA_PATH  = 'data/';

let numCols = 4;

// ── Column stepper ─────────────────────────────────────────
function adjustCols(delta) {
  numCols = Math.max(1, Math.min(14, numCols + delta));
  document.getElementById('col-count').textContent = numCols;
  document.getElementById('grid-container').style.setProperty('--cols', numCols);
  setTimeout(() => {
    document.querySelectorAll('canvas.day-canvas').forEach(c => {
      if (c._records !== undefined) drawDayDiagram(c, c._records);
    });
  }, 50);
}

let countMode = 'periods';   

// Count 'periods' | 'points' ─────────────────────────────────────────

function toggleMode() {
  countMode = countMode === 'periods' ? 'points' : 'periods';
  document.getElementById('mode-btn').textContent =
    countMode === 'periods' ? 'perioden' : 'metingen';
  document.querySelectorAll('canvas.day-canvas').forEach(c => {
    if (c._records !== undefined) drawDayDiagram(c, c._records);
  });
}


// ── Parse raw JSON ─────────────────────────────────────────
function parseRecords(raw) {
  return raw.map(r => ({
    mx:       parseFloat(r.values.noise_LA_max) || 0,
    eq:       parseFloat(r.values.noise_LAeq)   || 0,
    mn:       parseFloat(r.values.noise_LA_min) || 0,
    t:        Date.parse(r.timestamp.replace(' ', 'T') + 'Z'),
    fullTime: utcToAmsterdam(r.timestamp)
  }));
}

// Day files are UTC → Amsterdam local time, "YYYY-MM-DD HH:MM:SS"
const amsFmt = new Intl.DateTimeFormat('sv-SE', {
  timeZone: 'Europe/Amsterdam',
  year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit',
  hourCycle: 'h23'
});
function utcToAmsterdam(ts) {
  return amsFmt.format(new Date(ts.replace(' ', 'T') + 'Z'));
}

// ── Geometry helpers ───────────────────────────────────────
function timeToAngleDeg(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return ((h * 60 + m) / 1440) * 360 - 90;
}
function timeToAngleDegSec(fullTime) { //this one includes seconds
  const [h, m, s] = fullTime.slice(11, 19).split(':').map(Number);
  return ((h * 3600 + m * 60 + s) / 86400) * 360 - 90;
}
function polarToXY(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

// ── Count threshold crossings ──────────────────────────────
function countCrossings(history, type, thr) {
  let count = 0, inPeriod = false;
  for (const p of history) {
    const v = type === 'max' ? p.mx : p.eq;
    if (v >= thr && !inPeriod) { count++; inPeriod = true; }
    else if (v < thr)           { inPeriod = false; }
  }
  return count;
}

// ── Draw radial diagram ────────────────────────────────────

// ── Periods above red threshold, with duration ─────────────
function getAbovePeriods(history, thr) {
  const periods = [];
  let cur = null;
  for (const p of history) {
    if (p.mx >= thr) {
      if (!cur) cur = { start: p.fullTime, end: p.fullTime, t0: p.t, t1: p.t, peak: p, n: 0 };
      cur.n++;
      cur.end = p.fullTime;
      cur.t1  = p.t;
      if (p.mx > cur.peak.mx) cur.peak = p;
    } else if (cur) {
      cur.end = p.fullTime;   // first reading back below the threshold closes the period
      cur.t1  = p.t;
      periods.push(cur);
      cur = null;
    }
  }
  if (cur) periods.push(cur);
  return periods;
}

// Arcs (in seconds of the day) for the periods above the threshold.
// A period is split where the clock label jumps back (the 25-hour day in October).
function getAboveArcs(history, thr) {
  const sec = p => {
    const [h, m, s] = p.fullTime.slice(11, 19).split(':').map(Number);
    return h * 3600 + m * 60 + s;
  };
  const arcs = [];
  let cur = null;
  for (const p of history) {
    const s = sec(p);
    if (p.mx >= thr) {
      if (cur && s < cur.end) { arcs.push(cur); cur = null; }   // clock went back
      if (!cur) cur = { start: s, end: s };
      else cur.end = s;
    } else if (cur) {
      if (s >= cur.end) cur.end = s;       // first reading below closes the arc
      arcs.push(cur);
      cur = null;
    }
  }
  if (cur) arcs.push(cur);
  return arcs;
}

function periodsTotalMinutes(periods) {
  return periods.reduce((sum, p) => sum + Math.max(0, Math.round((p.t1 - p.t0) / 60000)), 0);
}

function fmtMinutes(mins) {
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m === 0 ? h + 'u' : h + 'u' + m + 'm';
}

function drawDayDiagram(canvas, history, explicitSize) {
  const dpr  = window.devicePixelRatio || 1;
  const size = explicitSize || canvas.clientWidth;
  if (size === 0) return;

  canvas.width  = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const pad   = size * 0.08;
  const outer = size / 2 - pad;

  ctx.clearRect(0, 0, size, size);

  if (!history || history.length === 0) {
    ctx.fillStyle = '#ccc';
    ctx.font = `${size * 0.07}px IBM Plex Mono, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('geen data', cx, cy);
    return;
  }

  // Threshold circles
  [[THRESHOLD1, 'rgba(100,150,255,0.55)'], [THRESHOLD2, 'rgba(220,0,80,0.55)']].forEach(([db, col]) => {
    const r = (db / DB_MAX) * outer;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.4, size * 0.002);
    //ctx.setLineDash([2, 4]);
    ctx.stroke();
    //ctx.setLineDash([]);
  });

  // Min–max bars
  for (const p of history) {
    const a    = timeToAngleDeg(p.fullTime.slice(11, 16));
    const rMin = (p.mn / DB_MAX) * outer;
    const rMax = (p.mx / DB_MAX) * outer;
    const alpha = Math.min(1, Math.max(0, (p.eq - 20) / 60));
    const [x1, y1] = polarToXY(cx, cy, rMin, a);
    const [x2, y2] = polarToXY(cx, cy, rMax, a);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(120,120,120,${alpha * 0.5})`;
    ctx.lineWidth = Math.max(0.5, size * 0.003);
    ctx.stroke();
  }

  // LAeq line
  ctx.beginPath();
  let first = true;
  for (const p of history) {
    const a = timeToAngleDeg(p.fullTime.slice(11, 16));
    const r = (p.eq / DB_MAX) * outer;
    const [x, y] = polarToXY(cx, cy, r, a);
    if (first) { ctx.moveTo(x, y); first = false; }
    else        { ctx.lineTo(x, y); }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = Math.max(0.8, size * 0.004);
  ctx.stroke();

  // Clock labels
  const fs = Math.max(7, size * 0.03);
  ctx.fillStyle = 'rgba(160,160,160,0.7)';
  ctx.font = `${fs}px IBM Plex Mono, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tickR = outer + pad * 0.55;
  [['00', - 90], ['06', 0], ['12', 90], ['18', -180]].forEach(([lbl, a]) => {
    const [x, y] = polarToXY(cx, cy, tickR, a);
    ctx.fillText(lbl, x, y);
  });


  // Red dots (depends on countMode)
    const redPeriods = getAbovePeriods(history, THRESHOLD2);

  if (countMode === 'periods') {
    // Period arcs, just outside the red threshold ring
    const arcR     = (THRESHOLD2 / DB_MAX) * outer + Math.max(3, size * 0.015);
    const minSweep = 0.6;                       // degrees, so single readings stay visible
    ctx.save();
    ctx.strokeStyle = 'rgba(220,0,80,0.9)';
    ctx.lineWidth   = Math.max(1.5, size * 0.007);
    ctx.lineCap     = 'butt';
    for (const arc of getAboveArcs(history, THRESHOLD2)) {
      const a1 = (arc.start / 86400) * 2 * Math.PI - Math.PI / 2;
      const a2 = Math.max((arc.end / 86400) * 2 * Math.PI - Math.PI / 2,
                          a1 + minSweep * Math.PI / 180);
      ctx.beginPath();
      ctx.arc(cx, cy, arcR, a1, a2);
      ctx.stroke();
    }
    ctx.restore();
  } else {
    // One dot per reading above the threshold
    const dotR = Math.max(1.2, size * 0.007);
    ctx.fillStyle = 'rgba(220,0,80,0.9)';
    for (const p of history) {
      if (p.mx < THRESHOLD2) continue;
      const a = timeToAngleDeg(p.fullTime.slice(11, 16));
      const r = (p.mx / DB_MAX) * outer;
      const [x, y] = polarToXY(cx, cy, r, a);
      ctx.beginPath();
      ctx.arc(x, y, dotR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Centre label
  if (redPeriods.length > 0) {
    const count     = countMode === 'periods'
      ? redPeriods.length
      : history.filter(p => p.mx >= THRESHOLD2).length;
    const totalMins = periodsTotalMinutes(redPeriods);
    const fsLarge = Math.max(9, size * 0.10);
    const fsSmall = Math.max(7, size * 0.055);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `500 ${fsLarge}px IBM Plex Mono, monospace`;
    ctx.fillStyle = 'rgba(220,0,80,0.90)';
    ctx.fillText(count + '×', cx, cy - fsSmall * 0.6);
    ctx.font = `300 ${fsSmall}px IBM Plex Mono, monospace`;
    ctx.fillStyle = 'rgba(220,0,80,0.65)';
    ctx.fillText(fmtMinutes(totalMins), cx, cy + fsLarge * 0.6);
  }
}


// ── Lightbox ───────────────────────────────────────────────

function getStatBlocks(records) {
  const bluePts = records.filter(p => p.eq >= THRESHOLD1).length;
  const bluePer = countCrossings(records, 'eq', THRESHOLD1);
  const redPts  = records.filter(p => p.mx >= THRESHOLD2).length;
  const redPer  = getAbovePeriods(records, THRESHOLD2).length;
  return [
    { cls: 'stat-blue', color: 'rgb(100,150,255)', align: 'right',
      lines: [`≥${THRESHOLD1} dB (eq)`, `${bluePts} metingen verdeeld over`, `${bluePer} aaneengesloten tijdsperioden`] },
    { cls: 'stat-red',  color: 'rgb(220,0,80)',    align: 'left',
      lines: [`≥${THRESHOLD2} dB (max)`, `${redPts} metingen verdeeld over`, `${redPer} aaneengesloten tijdsperioden`] }
  ];
}

function getDateLines(date) {
  const d = new Date(date + 'T00:00:00');
  const weekday = d.toLocaleDateString('nl-NL', { weekday: 'short' });
  return [
    weekday + ' ' + date,
    'Sensor ' + currentSensor
  ];
}

function openLightbox(date, records) {
  lightboxState = { date, records };
  const lb     = document.getElementById('lightbox');
  const lbCvs  = document.getElementById('lightbox-canvas');
  const lbDate = document.getElementById('lightbox-date');
  const lbStat = document.getElementById('lightbox-stats');

  const size = Math.floor(Math.min(window.innerWidth * 0.88, window.innerHeight * 0.82));
  lbCvs.style.width  = size + 'px';
  lbCvs.style.height = size + 'px';
  drawDayDiagram(lbCvs, records, size);

  lbDate.textContent = getDateLines(date).join('\n');
  lbStat.innerHTML = getStatBlocks(records)
    .map(b => `<span class="${b.cls}">${b.lines.join('<br>')}</span>`)
    .join('');

  lb.classList.add('open');
  document.addEventListener('keydown', onEsc);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', onEsc);
}
function onEsc(e) { if (e.key === 'Escape') closeLightbox(); }

// ── Render grid ────────────────────────────────────────────
function renderGrid(results, sensorId) {
  const container = document.getElementById('grid-container');
  container.style.setProperty('--cols', numCols);
  currentSensor = sensorId;

  // Newest first
  const sorted = [...results].sort((a, b) => b.date.localeCompare(a.date));

  let html = '';
  for (const { date, records } of sorted) {
    const noData = records.length === 0;
    const above1 = countCrossings(records, 'eq',  THRESHOLD1);
    const above2 = countCrossings(records, 'max', THRESHOLD2);
    const d = new Date(date + 'T00:00:00');
    const weekday = d.toLocaleDateString('nl-NL', { weekday: 'short' });
    
    html += `<div class="day-cell${noData ? ' no-data' : ''}" data-date="${date}" onclick="handleCellClick('${date}')">`;
    html += `<div class="cell-date"><span style="opacity:1">${weekday}</span> ${date.slice(8)} <span style="opacity:.6">${date.slice(5,7)}</span></div>`;
    //html += `<div class="cell-date">${date.slice(8)} <span style="opacity:.4">${date.slice(5,7)}</span></div>`;
    html += `<canvas class="day-canvas" id="canvas-${date}"></canvas>`;
    //if (!noData) {
      //html += `<div class="cell-stats"><span class="stat-blue">${above1}×</span></div>`;
    //}
    html += `</div>`;
  }

  container.innerHTML = html || '<p class="loading-msg">Geen resultaten.</p>';

  for (const { date, records } of sorted) {
    const canvas = document.getElementById(`canvas-${date}`);
    if (canvas) {
      canvas._records = records;
      drawDayDiagram(canvas, records);
    }
  }

  const total = results.filter(r => r.records.length > 0).length;
  document.getElementById('header-meta').textContent =
    `${sensorId} · ${total} / ${results.length} dagen`;
}

// ── Cell click ─────────────────────────────────────────────
function handleCellClick(date) {
  const canvas = document.getElementById(`canvas-${date}`);
  if (!canvas || !canvas._records || canvas._records.length === 0) return;
  openLightbox(date, canvas._records);
}

// ── Main loader ────────────────────────────────────────────
async function loadAll() {
  const sensorId  = document.getElementById('sensorId').value.trim();
  const container = document.getElementById('grid-container');
  const statusEl  = document.getElementById('status-msg');

  container.innerHTML  = '<p class="loading-msg">manifest.json laden…</p>';
  statusEl.className   = 'status-msg';
  statusEl.textContent = '';

  // 1. Fetch manifest
  let dates;
  try {
    const res = await fetch(`${DATA_PATH}manifest.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const manifest = await res.json();
    dates = Array.isArray(manifest) ? manifest : manifest.dates;
    if (!Array.isArray(dates) || dates.length === 0) throw new Error('leeg manifest');
  } catch (err) {
    statusEl.className   = 'status-msg error';
    statusEl.textContent = `manifest.json niet gevonden (${err.message})`;
    container.innerHTML  =
      `<pre class="loading-msg">Maak data/manifest.json aan:\n\n[\n  "2026-02-01",\n  "2026-02-28"\n]\n\nOf gebruik generate-manifest.sh.</pre>`;
    return;
  }

  container.innerHTML = '<p class="loading-msg">Dagbestanden laden…</p>';

  // 2. Filter to the selected sensor, then fetch
  const filtered = dates.filter(stem => stem.startsWith(`sensor${sensorId}_`));

  if (filtered.length === 0) {
    container.innerHTML = `<p class="loading-msg">Geen bestanden gevonden voor sensor ${sensorId}.</p>`;
    return;
  }

  const results = await Promise.all(filtered.map(async stem => {
    // Extract the date portion (last 10 chars: YYYY-MM-DD)
    const date = stem.slice(-10);
    try {
      const res = await fetch(`${DATA_PATH}${stem}.json`);
      if (!res.ok) throw new Error('not found');
      const raw = await res.json();
      return { date, records: parseRecords(raw) };
    } catch {
      return { date, records: [] };
    }
  }));

  // Regroup by Amsterdam date (a UTC day file spans two local days)
  const byDay = new Map();
  const seen  = new Set();                       // drops readings that appear in two files
  for (const { date, records } of results) {
    if (!byDay.has(date)) byDay.set(date, []);   // keep empty/failed days visible
    for (const r of records) {
      if (seen.has(r.t)) continue;
      seen.add(r.t);
      const d = r.fullTime.slice(0, 10);
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(r);
    }
  }
  const regrouped = [...byDay].map(([date, records]) => ({
    date,
    records: records.sort((a, b) => a.t - b.t)
  }));

  renderGrid(regrouped, sensorId);
}

// Auto-load on open
loadAll();


// ── Resize ─────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll('canvas.day-canvas').forEach(c => {
      if (c._records !== undefined) drawDayDiagram(c, c._records);
    });
  }, 150);
});


// ── Export functions ─────────────────────────────────────────────────

let lightboxState = null;
let currentSensor = '';

// Offscreen render. transparent=true keeps the background transparent (PNG);
// false paints white (PDF).
// Centred text with letter-spacing (mirrors CSS letter-spacing: 0.1em)
function drawSpaced(ctx, text, cx, y, spacing) {
  const chars  = [...text];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total  = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let x = cx - total / 2;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, x, y); x += widths[i] + spacing; });
}

function renderExportCanvas(date, records, px = 3000, transparent = true) {
  const dpr    = window.devicePixelRatio || 1;
  const margin = Math.round(px * 0.06);

  // Same proportions as the lightbox: date 12px, stats 14px, 14px gaps
  const statFs = Math.round(px * 0.02);
  const dateFs = Math.round(statFs * 12 / 14);
  const lineH  = 1.5;
  const gap    = statFs;

  const dateLines = getDateLines(date);
  const blocks    = getStatBlocks(records);
  const statRows  = Math.max(...blocks.map(b => b.lines.length));

  const dateH = dateLines.length * dateFs * lineH;
  const statH = statRows * statFs * lineH;

  const W = px + margin * 2;
  const H = margin + px + gap + dateH + gap + statH + margin;
  const midX = W / 2;

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  if (!transparent) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }

  // Diagram
  const tmp = document.createElement('canvas');
  drawDayDiagram(tmp, records, px / dpr);
  ctx.drawImage(tmp, margin, margin, px, px);

  // Date lines (same text as the lightbox, uppercase, letter-spacing 0.1em)
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#aaa';
  ctx.font = `${dateFs}px IBM Plex Mono, monospace`;
  let y = margin + px + gap;
  dateLines.forEach((line, i) => {
    drawSpaced(ctx, line.toUpperCase(), midX, y + (i + 0.5) * dateFs * lineH, dateFs * 0.1);
  });

  // Stat blocks: blue right-aligned left of the centre, red left-aligned right of it
  y += dateH + gap;
  const colGap = statFs * 1.7;
  ctx.font = `${statFs}px IBM Plex Mono, monospace`;
  for (const b of blocks) {
    ctx.textAlign = b.align;
    ctx.fillStyle = b.color;
    const x = b.align === 'right' ? midX - colGap / 2 : midX + colGap / 2;
    b.lines.forEach((text, i) => ctx.fillText(text, x, y + (i + 0.5) * statFs * lineH));
  }

  return out;
}

function downloadPNG(date, records) {
  renderExportCanvas(date, records, 3000, true).toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sensor${currentSensor}_${date}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

function downloadPDF(date, records) {
  const c = renderExportCanvas(date, records, 3000, false);
  const { jsPDF } = window.jspdf;
  const w = 210, h = w * c.height / c.width;
  const pdf = new jsPDF({ orientation: h > w ? 'p' : 'l', unit: 'mm', format: [w, h] });
  pdf.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, w, h);
  pdf.save(`sensor${currentSensor}_${date}.pdf`);
}

function exportCurrent(kind) {
  if (!lightboxState) return;
  const { date, records } = lightboxState;
  kind === 'pdf' ? downloadPDF(date, records) : downloadPNG(date, records);
}
